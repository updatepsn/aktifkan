      font-size:18px;
      font-weight:bold;
      transition:0.3s;
      margin-top:10px;
    }
    button:hover {
      background:#0000FF;

    /* huruf berjalan */
    .marquee {
      background:#d00;
      color:#fff;
      padding:10px 0;
      white-space:nowrap;
      overflow:hidden;
      font-size:16px;
    }
    .marquee span {
      display:inline-block;
      padding-left:100%;
      animation:marquee 15s linear infinite;
    }
    @keyframes marquee {
      0%{transform:translateX(0);}
      100%{transform:translateX(-100%);}
    }

    /* slider gambar */
    .slider {
      overflow:hidden;
      width:100%;
      margin:0 auto 20px;
      background:#fff;
    }
    .slider-track {
      display:flex;
      animation:scroll 20s linear infinite;
    }
    .slider img {
      width:90px;
      height:90px;
      margin:12px;
      border-radius:12px;
    }
    @keyframes scroll {
      0% {transform:translateX(0);}
      100% {transform:translateX(-100%);}
    }
  </style>
